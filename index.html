<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Физика с Си</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=Literata:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* layout: ночное небо; Си слева, лист с задачей по центру, ответ под ним; всё остальное — в выезжающих панелях */
:root{
  --sky:#0a0d26; --sky2:#171b4a; --panel:rgba(19,23,60,.78); --panel2:rgba(40,46,104,.55); --line:rgba(170,178,255,.18);
  --ink:#eceafe; --muted:#a8aad8; --faint:#6f73a8;
  --comet:#ffbf69; --comet-ink:#2b1a04; --iris:#7fd8ff; --good:#7fe0a8; --bad:#ff8193; --warn:#ffd36b;
  --f-display:"Unbounded",system-ui,sans-serif; --f-body:"Onest",system-ui,sans-serif;
  --f-read:"Literata",Georgia,serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:15px/1.5 var(--f-body);
  background:radial-gradient(ellipse 70% 50% at 15% 0%,#26215e 0,transparent 70%),radial-gradient(ellipse 60% 50% at 95% 100%,#122a5c 0,transparent 70%),var(--sky);background-attachment:fixed}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--iris);outline-offset:2px;border-radius:8px}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding-inline:16px}
.top{display:flex;align-items:center;gap:14px;width:100%;max-width:1180px;margin-inline:auto;padding-block:14px}
.brand{font:700 15px var(--f-display);letter-spacing:.02em;display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand b{color:var(--iris);font-weight:700}
.brand span{color:var(--muted);font-weight:500}
.hours{margin-left:auto;font:600 13px var(--f-mono);color:var(--comet);white-space:nowrap;font-variant-numeric:tabular-nums}
.nav{display:flex;gap:4px}
.nav button{display:flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:10px;padding:7px 10px;color:var(--muted);font-size:14px}
.nav button:hover{color:var(--ink);border-color:var(--line);background:var(--panel2)}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:620px){.nav span{display:none}.nav button{padding:8px}}

.stage{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:780px;margin-inline:auto;padding-block:6px 48px;flex:1}
.si{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.avatar{position:relative;width:min(180px,46vw);aspect-ratio:1;border-radius:30px;overflow:hidden;background:var(--sky2);border:1px solid rgba(127,216,255,.35);box-shadow:0 0 0 6px rgba(127,216,255,.06),0 18px 60px rgba(70,80,220,.4)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .25s}
.avatar img.off{opacity:0}
.avatar .tag{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font:700 11px var(--f-display);letter-spacing:.14em;background:rgba(10,13,38,.78);border:1px solid var(--line);padding:2px 10px;border-radius:99px;color:var(--iris)}
.bubble{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative;min-width:0}
.bubble::before{content:"";position:absolute;top:-7px;left:50%;margin-left:-6px;width:12px;height:12px;background:inherit;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.who{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--iris);margin-bottom:4px}
.say{margin:0;overflow-wrap:anywhere;font-size:15.5px}
.chatlog{display:flex;flex-direction:column;gap:8px;max-height:min(50vh,460px);overflow:auto;margin-top:8px}
.chatlog:empty{display:none}
.msg{padding:8px 10px;border-radius:12px;background:var(--panel2);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:rgba(255,191,105,.14);border:1px solid rgba(255,191,105,.25);max-width:90%}
.msg.tool{background:none;border:1px dashed rgba(127,216,255,.35);color:var(--iris);font-size:13px}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.choices:empty{display:none}
.quick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.quick button{border:1px solid var(--line);background:rgba(10,13,38,.55);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.quick button:hover{color:var(--ink);border-color:rgba(127,216,255,.45)}
.quick button:disabled{opacity:.4;cursor:default}
.chat{display:flex;gap:6px;width:100%}
.chat input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.chat input::placeholder{color:var(--faint)}
.chat button{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:0 12px}
.work{display:flex;flex-direction:column;gap:14px;min-width:0;width:100%}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.chip{font:500 12px var(--f-mono);padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(10,13,38,.5);white-space:nowrap}
.chip.why{color:var(--comet);border-color:rgba(255,191,105,.35)}
.chip.side{color:var(--iris);border-color:rgba(127,216,255,.4)}
.chip.heat{color:#ffd9a0;border-color:rgba(255,191,105,.5);background:rgba(255,191,105,.1)}
.sheet-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 30px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
@media (max-width:620px){.sheet-card{padding:18px}}
.ptitle{font:600 13px var(--f-display);letter-spacing:.04em;color:var(--muted);margin:0 0 12px;text-wrap:balance}
.ptext{font:400 1.1rem/1.65 var(--f-read);overflow-wrap:anywhere}
.ptext mjx-container{font-size:105%!important}
.intro{font:400 1rem/1.6 var(--f-read);border:1px dashed rgba(127,216,255,.45);border-radius:14px;padding:12px 16px;margin-bottom:16px;background:rgba(127,216,255,.06)}
.intro .lab{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--iris);display:block;margin-bottom:4px}
.fig{margin-top:14px;max-width:100%;text-align:center}
.fig img{max-height:260px}
.note{font-size:13px;color:var(--faint);margin-top:12px}
.answer{display:flex;flex-direction:column;gap:10px}
.arow{display:flex;gap:8px;align-items:stretch}
.arow textarea{flex:1;min-width:0;resize:vertical;min-height:52px;background:rgba(10,13,38,.7);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font:500 17px var(--f-mono)}
.arow textarea:focus{border-color:var(--iris);outline:none}
.unit{display:flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-radius:14px;font:500 14px var(--f-mono);color:var(--muted);white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 16px;font-weight:500}
.btn:hover{border-color:rgba(170,178,255,.4)}
.btn.primary{background:var(--comet);color:var(--comet-ink);border-color:var(--comet);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.quiet{background:none;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.reveal{display:flex;flex-direction:column;gap:12px}
.reveal:empty{display:none}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.box h4{margin:0 0 6px;font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.box.trick{border-color:rgba(127,216,255,.4);background:linear-gradient(135deg,rgba(127,216,255,.1),rgba(19,23,60,.8))}
.box.trick h4{color:var(--iris)}
.box.trick b{font:600 16px var(--f-display);display:block;margin-bottom:4px}
.box .read{font:400 1rem/1.65 var(--f-read)}
.verdict-ok{color:var(--good)}.verdict-bad{color:var(--bad)}
.loading{display:flex;align-items:center;gap:12px;color:var(--muted);font-family:var(--f-read);font-size:1.05rem}
.orbit{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--comet);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* выезжающая панель */
.drawer{position:fixed;inset:0;z-index:10}
.scrim{position:absolute;inset:0;background:rgba(5,6,20,.55);backdrop-filter:blur(2px)}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:#11143a;border-left:1px solid var(--line);display:flex;flex-direction:column;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.panel header{display:flex;align-items:center;gap:10px;padding:16px 20px calc(10px);padding-top:calc(16px + env(safe-area-inset-top,0px))}
.panel h2{margin:0;font:700 18px var(--f-display);flex:1}
.x{background:none;border:1px solid var(--line);border-radius:10px;width:34px;height:34px;font-size:18px;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:0 20px 10px}
.tabs:empty{display:none}
.tabs button{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--sky);border-color:var(--ink)}
.dbody{overflow:auto;padding:4px 20px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.dbody h3{margin:0;font:600 17px var(--f-display);text-wrap:balance}
.dbody h4{margin:0 0 8px;font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--comet)}
.now{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:16px}
.now p{margin:4px 0 0;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.list .n{font:500 12px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.list .lock{color:var(--faint)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--iris);border-radius:99px}
.bar.c i{background:var(--comet)}
.pct{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:36px}
details.sec{border-top:1px solid var(--line);padding-top:8px}
details.sec summary{cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 80px 40px;gap:10px;align-items:center;padding:4px 0;list-style:none}
details.sec summary::-webkit-details-marker{display:none}
.skrow{display:grid;grid-template-columns:minmax(0,1fr) 80px 40px;gap:10px;align-items:center;font-size:14px;padding:3px 0 3px 12px;color:var(--muted)}
.skrow.on{color:var(--ink)}
.small{font-size:13px;color:var(--muted)}
.rules{background:rgba(255,191,105,.07);border:1px solid rgba(255,191,105,.25);border-radius:14px;padding:12px 14px;font-size:14px}
.rules ul{margin:6px 0 0;padding-left:18px}
.oly{border:1px solid var(--line);border-radius:14px;background:var(--panel2)}
.oly.marked{border-color:rgba(255,191,105,.55)}
.oly.off{opacity:.55}
.oly summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.oly summary::-webkit-details-marker{display:none}
.oname{font-weight:600}
.lvl{font:600 11px var(--f-mono);border-radius:6px;padding:1px 6px;margin-left:6px;border:1px solid var(--line);color:var(--muted);vertical-align:2px}
.lvl.l1{color:var(--comet);border-color:rgba(255,191,105,.5)}
.lvl.lv{color:var(--iris);border-color:rgba(127,216,255,.5)}
.onext{grid-column:1;font-size:13px;color:var(--muted)}
.onext b{color:var(--ink);font-weight:500}
.onext .soon{color:var(--warn)}
.mark{grid-row:1/3;grid-column:2;border:1px solid var(--line);background:none;border-radius:10px;padding:6px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.mark[aria-pressed="true"]{background:var(--comet);color:var(--comet-ink);border-color:var(--comet);font-weight:600}
.obody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.stages{width:100%;border-collapse:collapse;font-size:13px}
.stages td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
.stages td:first-child{font-family:var(--f-mono);white-space:nowrap;padding-right:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stages tr.past td{opacity:.45}
.obody ul{margin:0;padding-left:18px}
.obody a{color:var(--iris)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font:600 20px var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.vbox{border-radius:14px;padding:12px 14px;border:1px solid var(--line);font-family:var(--f-read)}
.vbox.bad{border-color:rgba(255,129,147,.5);background:rgba(255,129,147,.08)}
.vbox.warn{border-color:rgba(255,211,107,.45);background:rgba(255,211,107,.07)}
.vbox.good{border-color:rgba(127,224,168,.45);background:rgba(127,224,168,.07)}
.calwrap{overflow-x:auto}
.cal{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px}
.cal i{border-radius:3px;background:rgba(255,255,255,.06)}
.cal i.l1{background:rgba(255,191,105,.28)}.cal i.l2{background:rgba(255,191,105,.5)}.cal i.l3{background:rgba(255,191,105,.75)}.cal i.l4{background:var(--comet)}
.cal i.fut{background:none}
.legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--faint);margin-top:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.solved{display:flex;flex-direction:column;gap:8px}
.solved details{border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.solved summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.solved summary::-webkit-details-marker{display:none}
.solved .d{font-size:12px;color:var(--faint);font-family:var(--f-mono)}
.res{font:500 12px var(--f-mono);border-radius:99px;padding:2px 8px;align-self:center;grid-row:1/3;grid-column:2}
.res.first{color:var(--good);border:1px solid rgba(127,224,168,.4)}
.res.help{color:var(--warn);border:1px solid rgba(255,211,107,.4)}
.res.gave{color:var(--bad);border:1px solid rgba(255,129,147,.4)}
.solved .read{padding:0 12px 12px;font:400 15px/1.6 var(--f-read)}
.tier{display:flex;flex-direction:column;gap:8px}
.tier label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.tier label:has(input:checked){border-color:var(--iris);background:rgba(127,216,255,.07)}
.notes li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.notes button{background:none;border:none;color:var(--faint)}
.empty{color:var(--muted);font-family:var(--f-read);border:1px dashed var(--line);border-radius:14px;padding:14px}

.box.lesson{border-color:rgba(127,216,255,.35)}
.box.lesson h4{color:var(--iris)}
.box.lesson summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.box.lesson summary::-webkit-details-marker{display:none}
.planbtns{display:flex;flex-wrap:wrap;gap:8px}
.sireply{border:1px solid rgba(127,216,255,.35);border-radius:14px;padding:12px 14px;font-family:var(--f-read)}
.tagc{font:500 11px var(--f-mono);color:var(--iris);border:1px solid rgba(127,216,255,.4);border-radius:6px;padding:0 5px;margin-left:6px}
.key{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-family:var(--f-mono)}
[hidden]:not([hidden=until-found i]){display:none!important}img{max-width:100%}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.avatar img{transition:none}}
</style>
</head><body>

<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <div class="brand"><b>Си</b><span>· физика</span></div>
    <div class="hours" id="hours" title="Время занятий">0 ч</div>
    <nav class="nav">
      <button data-open="plan" aria-label="План"><svg viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7"/></svg><span>План</span></button>
      <button data-open="progress" aria-label="Прогресс"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Прогресс</span></button>
      <button data-open="solved" aria-label="Решённые"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 12l3 3 5-6"/></svg><span>Решённые</span></button>
      <button data-open="settings" aria-label="Настройки"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Настройки</span></button>
    </nav>
  </header>

  <main class="stage">
    <aside class="si">
      <div class="avatar"><img id="siImg" src="si/watch.webp" alt="Си смотрит на тебя"><span class="tag">СИ</span></div>
      <div class="bubble" aria-live="polite">
        <div class="who">Си</div>
        <p class="say" id="say">Сейчас, только очки протру…</p>
        <div class="choices" id="choices"></div>
        <div class="chatlog" id="chatlog"></div>
      </div>
      <div class="quick" id="quick">
        <button type="button" data-q="lesson">Объясни тему</button>
        <button type="button" data-q="start">С чего начать?</button>
        <button type="button" data-q="steps" hidden>Разбери по шагам</button>
        <button type="button" data-q="dunno">Я этого не знаю</button>
      </div>
      <form class="chat" id="chatForm" autocomplete="off">
        <input id="chatIn" placeholder="Спросить Си про эту задачу" aria-label="Вопрос Си про эту задачу">
        <button aria-label="Отправить">→</button>
      </form>
    </aside>

    <section class="work">
      <div class="meta" id="meta"></div>
      <div id="lesson"></div>
      <article class="sheet-card" id="problem"></article>
      <form class="answer" id="answerForm" autocomplete="off">
        <div class="arow">
          <textarea id="answer" rows="1" placeholder="Ответ" aria-label="Ответ"></textarea>
          <div class="unit" id="unit" hidden></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="checkBtn">Проверить</button>
          <button type="button" class="btn" id="hintBtn">Подсказка</button>
          <button type="button" class="btn quiet" id="disputeBtn" hidden>Мой ответ верный</button>
          <button type="button" class="btn quiet" id="giveBtn">Сдаюсь</button>
          <button type="button" class="btn primary" id="nextBtn" hidden>Следующая задача</button>
        </div>
      </form>
      <div class="reveal" id="reveal"></div>
    </section>
  </main>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="scrim" data-act="close"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <header><h2 id="dTitle"></h2><button class="x" data-act="close" aria-label="Закрыть">×</button></header>
    <div class="tabs" id="dTabs" role="tablist"></div>
    <div class="dbody" id="dBody"></div>
  </div>
</div>

<script>
window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],processEscapes:true},svg:{fontCache:'global'},startup:{typeset:false}};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" async></script>

const byId=id=>SK.find(k=>k.id===id)||S.prog.custom.find(k=>k.id===id)||SQ.find(k=>k.id===id);
function PLAN(all){
 const base=[...SK,...S.prog.custom];
 const order=S.prog.order?S.prog.order.map(byId).filter(k=>k&&!k.side):[];
 for(const k of base) if(!order.includes(k)) order.push(k);
 return all?order:order.filter(k=>!S.prog.skip[k.id]);
}

function save(now){dirty=true;clearTimeout(saveT);saveT=setTimeout(flush,now?250:30000)}

 try{await store.save(S)}catch(e){dirty=true;console.warn('save',e)}
 saving=false;
 if(dirty) save(true);
}

/* ---------- модель ученика ---------- */
const elo=(r,D)=>1/(1+10**((D-r)/400));
function prior(){const st=Object.values(S.sk).filter(s=>s.n>=3);return Math.max(850,(st.length?avg(st.map(s=>s.r)):1000)-100)}
function sk(id){return S.sk[id]||(S.sk[id]={r:prior(),n:0,ok:0,last:0,due:0,iv:0})}
function mastery(id){const s=S.sk[id];if(!s||!s.n)return 0;return clamp((s.r-800)/700,0,1)*(.6+.4*Math.min(1,s.n/4))}
const introduced=k=>{const s=S.sk[k.id];return !!s&&s.n>=2&&mastery(k.id)>=.55};
const unlocked=k=>k.p.every(p=>!byId(p)||S.prog.skip[p]||(S.sk[p]?.n>=2&&mastery(p)>=.35));
const frontier=()=>PLAN().find(k=>!introduced(k)&&unlocked(k)&&(S.sk[k.id]?.n||0)<6);
const sessionHeat=()=>Math.min(3,Math.floor((S.sess.ok||0)/3));
function ancestors(id,acc=new Set()){for(const p of byId(id)?.p||[]) if(!acc.has(p)){acc.add(p);ancestors(p,acc)} return [...acc]}

function nextEvent(o){
 const t0=pdate(today()).getTime();
 for(const st of (o.stages||[]).filter(s=>s.k!=='info')){
  const end=pdate(st.to||st.from).getTime();
  if(end>=t0) return {st,at:Math.max(pdate(st.from).getTime(),t0),days:Math.round((Math.max(pdate(st.from).getTime(),t0)-t0)/DAY),now:pdate(st.from).getTime()<=t0};
 }
 return null;
}
function nextRoundAfter(o){
 const t0=pdate(today()).getTime();
 const st=(o.stages||[]).find(s=>(s.k==='round'||s.k==='final')&&pdate(s.to||s.from).getTime()>=t0);
 return st?{st,days:Math.max(0,Math.round((pdate(st.from).getTime()-t0)/DAY))}:null;
}
function olyReadiness(o){const ks=(o.focus||[]).map(byId).filter(k=>k&&k.g<=grade());return ks.length?avg(ks.map(k=>mastery(k.id))):0}
function olyTarget(){
 let best=null;
 for(const o of OLY){
  if(!S.oly[o.id]||o.off) continue;
  const r=nextRoundAfter(o); if(!r||r.days>60) continue;
  const w=Math.min(.6,.15+.45*(1-r.days/60));
  if(!best||w>best.w) best={o,w,ev:r};
 }
 if(!best) return null;
 const pool=(best.o.focus||[]).map(byId).filter(k=>k&&k.g<=grade()&&!S.prog.skip[k.id]).sort((a,b)=>mastery(a.id)-mastery(b.id));
 return pool.length?{...best,k:pick(pool.slice(0,3))}:null;
}
function pickNext(){
 if(S.diag?.queue.length) return {k:byId(S.diag.queue[0]),why:'diag'};
 const q=S.prog.queue.find(x=>byId(x.skill));
 if(q) return {k:byId(q.skill),why:'si',q};
 const now=Date.now(), C=[], last=S.cur?.skill, plan=PLAN();
 const f=frontier(); if(f) C.push({w:.5,k:f,why:'new'});
 const due=plan.filter(k=>S.sk[k.id]?.n&&S.sk[k.id].due<=now).sort((a,b)=>(S.sk[a.id].due-S.sk[b.id].due)||(mastery(a.id)-mastery(b.id)));
 if(due.length) C.push({w:.3,k:due[0],why:'review'});
 const weak=plan.filter(k=>S.sk[k.id]?.n>=2&&mastery(k.id)<.45).sort((a,b)=>mastery(a.id)-mastery(b.id));
 if(weak.length) C.push({w:.2,k:weak[0],why:'grind'});
 const o=olyTarget(); if(o) C.push({w:o.w,k:o.k,why:'oly',oly:o.o,ev:o.ev});
 let P=C.filter(c=>c.k.id!==last); if(!P.length) P=C;
 if(!P.length){const studied=plan.filter(k=>S.sk[k.id]?.n).sort((a,b)=>S.sk[a.id].last-S.sk[b.id].last);return {k:studied[0]||plan[0]||SK[0],why:'review'}}
 let x=Math.random()*P.reduce((a,c)=>a+c.w,0);
 for(const c of P) if((x-=c.w)<=0) return c;
 return P[0];
}
function shape(c){
 const s=sk(c.k.id), m=mastery(c.k.id), heat=c.why==='diag'?0:sessionHeat();
 let d=clamp(Math.round((s.r-108-700)/100),1,10), task=null, fmt;
 const first=c.why==='new'&&!s.n;
 if(c.why==='diag'){
  const p2=c.k.e.filter(t=>t>=22&&t<=23), p1=c.k.e.filter(t=>t<=20);
  task=pick(p2.length?p2:p1); d=task>20?5:4;
  fmt=`ДИАГНОСТИКА уровня: типичная задача ЕГЭ №${task} (${EGE[task]}). Проверяет, владеет ли ученик темой без подготовки; без ловушек и экзотики.`;
 }else if(c.why==='oly'){
  d=Math.max(d+1,c.ev.st.k==='final'?8:6);
  fmt=`олимпиадная задача в стиле олимпиады «${c.oly.name}» (${c.ev.st.t}). ${c.oly.style||''} Только программа ${grade()} класса. Ответ — число.`;
 }else if(!c.k.e.length){
  d=Math.max(d,5); fmt='олимпиадная задача на эту тему, ответ — число.';
 }else{
  const p1=c.k.e.filter(t=>t<=20), p2=c.k.e.filter(t=>t>20);
  const part2=p2.length&&!first&&(m>=.7||!p1.length||(m>=.45&&Math.random()<.5)||heat>=2);
  task=pick(part2?p2:p1);
  if(task<=20) d=Math.min(d,4); else if(task<=23) d=clamp(d,4,6); else d=clamp(d,6,8);
  fmt=`ЕГЭ, задание №${task}: ${EGE[task]}.`;
 }

async function SAMPLE(input,o={}){

 const messages=typeof input==='string'?[{role:'user',content:input}]:input.map(m=>({role:m.role,content:m.content}));
 const tools=o.tools||[], defs=tools.map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema||{type:'object',properties:{}}}));

 for(let i=0;i<10;i++){
  const r=await api({model:MODELS[o.modelTier]||MODELS.default,max_tokens:8000,messages,...(defs.length?{tools:defs}:{})});
  if(r.stop_reason==='refusal') throw {code:'refused'};
  text+=r.content.filter(b=>b.type==='text').map(b=>b.text).join('');
  if(r.stop_reason!=='tool_use') break;
  messages.push({role:'assistant',content:r.content});
  const results=[];
  for(const b of r.content.filter(b=>b.type==='tool_use')){
   const t=tools.find(t=>t.name===b.name);
   try{results.push({type:'tool_result',tool_use_id:b.id,content:String(await t.execute(b.input))})}
   catch(e){results.push({type:'tool_result',tool_use_id:b.id,content:String(e?.message||e),is_error:true})}
  }
  messages.push({role:'user',content:results});
 }
 if(!text.trim()) throw {code:'empty_completion'};
 o.onText?.({text});

}

/* ---------- проверка ответа ---------- */
function parseNum(s){
 let t=String(s).trim().replace(/\s+/g,'').replace(/,/g,'.').replace(/[−–]/g,'-');
 t=t.replace(/[×x·*]10\^?\(?([+-]?\d+)\)?/i,'e$1').replace(/^10\^\(?([+-]?\d+)\)?/,'1e$1');
 const m=t.match(/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i);
 return m?Number(m[0]):NaN;
}
const digits=s=>String(s).replace(/\D/g,'');
const normStr=s=>String(s).toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/\+-|\+\/-/g,'±');
function judge(p,input){
 if(p.type==='num'){const v=parseNum(input);if(isNaN(v))return {ok:false,why:'nan'};const a=p.answer;
  if(Math.abs(v-a)<=Math.max(Math.abs(a)*p.tol,1e-12)) return {ok:true};
  if(a!==0&&v!==0){const r=v/a;if(r<0)return {ok:false,why:'sign'};const l=Math.log10(Math.abs(r));
   if(Math.abs(l)>=.95&&Math.abs(l-Math.round(l))<.03)return {ok:false,why:'order'};
   if(Math.abs(r-2)<.03||Math.abs(r-.5)<.015)return {ok:false,why:'two'};
   if(Math.abs(r-1)<.12)return {ok:false,why:'close'}}
  return {ok:false};}
 if(p.type==='set') return {ok:[...digits(input)].sort().join('')===[...digits(p.answer)].sort().join('')&&digits(input).length>0};
 if(p.type==='seq') return {ok:digits(input)===digits(p.answer)&&digits(input).length>0};
 return {ok:normStr(input)===normStr(p.answer)};
}

function secs(days){let s=0;for(let i=0;i<days;i++){const d=new Date(Date.now()-i*DAY);s+=S.days[dkey(d)]||0}return s}

 const up=OLY.filter(o=>S.oly[o.id]&&!o.off&&(nextRoundAfter(o)?.days??999)<=45).length;
 return Math.round(min/weeks+Math.min(180,up*90));
}

/* ---------- действия ---------- */
function learn(p,s){
 const st=sk(p.skill), D=700+100*p.d, E=elo(st.r,D), K=st.n<3?120:st.n<8?70:40;
 st.r=Math.round(st.r+K*(s-E)); st.n++; if(s>=.6)st.ok++; st.last=Date.now();
 st.iv=s>=.6?Math.min(60,Math.max(1,(st.iv||1)*(s>=.9?2.5:1.8))):1; st.due=Date.now()+st.iv*DAY;
 if(p.extra){const x=sk(p.extra);x.n++;x.r=Math.round(x.r+60*(s-elo(x.r,D)));x.last=Date.now()}
 S.hist.push({t:Date.now(),k:p.skill,d:p.d,s:Math.round(s*100)/100,w:p.why}); if(S.hist.length>400) S.hist.splice(0,S.hist.length-400);
 if(p.trick&&!S.tricks.some(t=>t.n===p.trick.name)){S.tricks.push({n:p.trick.name,i:p.trick.idea,k:p.skill,t:Date.now()});if(S.tricks.length>300)S.tricks.shift()}
 touchSession(); if(s>=.6&&p.why!=='diag') S.sess.ok=(S.sess.ok||0)+1; S.sess.n=(S.sess.n||0)+1;
}
function setKnown(id,r){const st=sk(id);st.r=Math.max(st.r,r);st.n=Math.max(st.n,4);st.iv=Math.max(st.iv||0,7);st.due=Math.max(st.due,Date.now()+7*DAY)}
function diagStep(p,s){
 const D=S.diag; if(!D) return null;
 D.queue=D.queue.filter(x=>x!==p.skill); D.res[p.skill]=s;
 if(s>=.6){ancestors(p.skill).forEach(a=>setKnown(a,1250)); setKnown(p.skill,s>=.9?1250:1150)}
 else{const st=sk(p.skill);st.r=Math.min(st.r,950);st.due=Date.now();
  D.queue=D.queue.filter(x=>{if(ancestors(x).includes(p.skill)){sk(x).r=Math.min(sk(x).r,950);D.res[x]=0;return false}return true})}
 if(D.queue.length) return null;
 const ok=Object.entries(D.res).filter(([,v])=>v>=.6).map(([k])=>byId(k).n), bad=Object.entries(D.res).filter(([,v])=>v<.6).map(([k])=>byId(k).n);
 S.diag=null; bump();
 const f=frontier();
 return `Диагностика закончена. ${ok.length?'Уверенно: '+ok.slice(0,4).join('; ')+(ok.length>4?' и ещё '+(ok.length-4):'')+'.':'Пока ничего уверенно — значит, строим с нуля, и это нормально.'} ${bad.length?'Надо подтянуть: '+bad.slice(0,3).join('; ')+'.':''} ${f?'Начинаем с темы «'+f.n+'» — с урока.':''}`;
}
function touchSession(){if(Date.now()-(S.sess.t||0)>45*60e3)S.sess={t:Date.now(),n:0,ok:0};S.sess.t=Date.now()}
function finish(p,status,s){
 const heatBefore=sessionHeat();
 p.status=status; p.done=Date.now(); p.score=s; learn(p,s); S.solvedN=(S.solvedN||0)+1;
 const diagMsg=p.why==='diag'?diagStep(p,s):null;
 store.addSolved(p).catch(e=>console.warn('solved',e));
 render(); save(true); prefetch();
 return {up:sessionHeat()>heatBefore,diagMsg};
}
$('#answer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&S.cur?.type!=='explain'){e.preventDefault();$('#answerForm').requestSubmit()}});

$('#answerForm').addEventListener('submit',async e=>{
 e.preventDefault(); const p=S.cur; const v=$('#answer').value.trim(); if(!v||p.status!=='open') return;
 if(p.type==='explain') return gradeExplain(p,v);
 const j=judge(p,v); p.tries.push(v);
 if(j.ok){
  const wrong=p.tries.length-1, s=wrong===0&&!p.hintUsed?1:Math.max(.3,1-.25*wrong-(p.hintUsed?.25:0));
  const r=finish(p,wrong===0&&!p.hintUsed?'first':'help',s);
  if(r.diagMsg) say(r.diagMsg,'happy');
  else if(r.up) say(pick(SAY.heat),'cool');
  else say(pick(s===1?SAY.first:SAY.later),s===1?'thumb':'happy');
 }else if(p.why==='diag'&&p.tries.length>=2){
  const r=finish(p,'gave',0); say(r.diagMsg||'Не страшно — это диагностика, она для того и нужна. Запомнила, вернёмся к этой теме с уроком.','think');
 }else{
  say(j.why?SAY[j.why]:pick(SAY.wrong),j.why==='close'?'think':'sigh');
  render(); save();
 }
});

function programSummary(){
 return 'id | тема | раздел | освоено | задач | статус\n'+PLAN(true).map(k=>{const s=S.sk[k.id];return `${k.id} | ${k.n} | ${SECTIONS[k.s]||'своя'} | ${Math.round(mastery(k.id)*100)}% | ${s?.n||0} | ${S.prog.skip[k.id]?'пропущена':introduced(k)?'знает':s?.n?'учит':unlocked(k)?'доступна':'закрыта'}${k.custom?', своя тема':''}`}).join('\n')
  +'\nСейчас изучаем: '+(frontier()?.id||'—')+'\nОчередь задач от Си: '+(S.prog.queue.map(q=>`${q.skill}×${q.n}: ${q.note}`).join('; ')||'пусто');
}

const TOOLS=[

 {name:'set_level',description:'Задать уровень ученика по теме, когда выяснилось, что он её знает или не знает. known — считать освоенной; learning — в процессе; unknown — учить с нуля (с уроком).',inputSchema:{type:'object',properties:{topic_id:{type:'string'},level:{type:'string',enum:['known','learning','unknown']}},required:['topic_id','level']},
  execute:({topic_id,level})=>{const k=topicArg(topic_id),st=sk(k.id);
   if(level==='known') setKnown(k.id,1250); else if(level==='learning'){st.r=1050;st.n=Math.max(st.n,1);st.due=Date.now()} else {st.r=850;st.n=0;st.due=0}
   return progChanged(`«${k.n}»: ${level==='known'?'освоена':level==='learning'?'в процессе':'с нуля'}`)}},
 {name:'move_topic',description:'Переставить тему: поставить сразу после темы after_id или в начало программы (after_id = "start"). Так меняется порядок изучения.',inputSchema:{type:'object',properties:{topic_id:{type:'string'},after_id:{type:'string'}},required:['topic_id','after_id']},
  execute:({topic_id,after_id})=>{const k=topicArg(topic_id);const ord=PLAN(true).map(x=>x.id).filter(x=>x!==k.id);
   const i=after_id==='start'?0:ord.indexOf(topicArg(after_id).id)+1; ord.splice(i,0,k.id); S.prog.order=ord;
   return progChanged(`«${k.n}» перемещена`)}},
 {name:'skip_topic',description:'Исключить тему из программы (skip = true) или вернуть её (skip = false).',inputSchema:{type:'object',properties:{topic_id:{type:'string'},skip:{type:'boolean'}},required:['topic_id','skip']},
  execute:({topic_id,skip})=>{const k=topicArg(topic_id);if(skip)S.prog.skip[k.id]=true;else delete S.prog.skip[k.id];return progChanged(`«${k.n}» ${skip?'убрана из программы':'возвращена'}`)}},
 {name:'add_topic',description:'Добавить в программу свою тему (например, нужную для олимпиады или за рамками школы). section — один из ключей: mech, mkt, el, mag, opt, qua, meth, oly. Возвращает id новой темы.',inputSchema:{type:'object',properties:{name:{type:'string'},section:{type:'string'},after_id:{type:'string'},description:{type:'string'},ege_tasks:{type:'array',items:{type:'integer'}}},required:['name','section','after_id','description']},
  execute:({name,section,after_id,description,ege_tasks})=>{if(S.prog.custom.length>=30)throw new Error('Слишком много своих тем');

   S.prog.custom.push(k); const ord=PLAN(true).map(x=>x.id).filter(x=>x!==k.id); const i=after_id==='start'?0:Math.max(0,ord.indexOf(String(after_id))+1)||ord.length; ord.splice(i,0,k.id); S.prog.order=ord;

/* ---------- чат ---------- */
function chatRules(p){
 return `Ты — Си: девушка-учёный, репетитор по физике. Характер: дразнишь, но поддерживаешь; очень рациональна и точна; объясняешь так, что становится понятно. Отвечай по-русски, коротко (до 150 слов, теорию — сколько нужно), формулы в $...$.
По текущей задаче: не выдавай ответ и полное решение, пока ученик явно не попросит или не сдался — веди наводящими вопросами и показывай полезные приёмы.
Теорию объясняй по-настоящему: суть, формула, мини-пример. Если ученик говорит, что чего-то не знает, — объясни и поправь программу.
${toolsOK?`У тебя есть инструменты управления программой: уровень тем, порядок, пропуск, свои темы, очередь задач по твоему замыслу, диагностика. Пользуйся ими, когда ученик просит изменить план, когда видно, что он не знает базу, или когда нужна серия задач на конкретную идею. После изменения скажи одной фразой, что сделала. id текущей темы: ${p.skill}.`:''}
Если узнала что-то устойчивое о том, как ученику удобнее учиться (например, любит энергетический подход или путается в проекциях), добавь в самом конце отдельной строкой: ЗАМЕТКА: <до 12 слов>.
Если ученик утверждает, что его ответ верен, проверь честно; если он прав (эталон ошибочен или ответ эквивалентен), начни ответ с [[ВЕРНО]].
Задача: ${p.text}
Эталонный ответ: ${p.answer} ${p.unit||''}
Решение (не цитируй без запроса): ${p.solution}
Попытки ученика: ${p.tries.join(' | ')||'нет'}
Статус: ${p.status==='open'?'не решена':p.status==='gave'?'ученик сдался':'решена'}`;
}
const cleanReply=t=>t.replace(/^\s*ЗАМЕТКА:.*$/m,'').replace('[[ВЕРНО]]','').trim();
let chatBusy=false;
async function ask(msg){
 if(!sample||chatBusy) return;
 const p=S.cur; p.chat.push({role:'user',content:msg}); if(p.chat.length>20)p.chat.splice(0,p.chat.length-20);
 renderChat(); chatBusy=true;
 const L=$('#chatlog'); const live=document.createElement('div'); live.className='msg'; live.textContent='Думаю…'; L.append(live); L.scrollTop=L.scrollHeight;
 mood('think');
 const notes=[];
 try{
  const turns=[{role:'user',content:chatRules(p)},...p.chat.filter(m=>m.role!=='tool').slice(-10)];
  const opts={modelTier:S.set.tier,cache:false,onText:({text})=>{live.innerHTML=fmt(cleanReply(text));L.scrollTop=L.scrollHeight}};
  if(toolsOK) opts.tools=liveTools(m=>{notes.push(m);const t=document.createElement('div');t.className='msg tool';t.textContent='✦ '+m;L.insertBefore(t,live)});
  const r=await sample(turns,opts);
  const note=r.text.match(/^\s*ЗАМЕТКА:\s*(.+)$/m);

 <div><h4>Экономия лимита</h4><p class="small">Проверка ответов, план, олимпиады и прогресс считаются на странице и не тратят лимит. Я трачу его на новую задачу (одна заранее, пока ты читаешь решение), на урок по новой теме (один раз — потом он сохранён), на ответы в чате и на пересборку плана — только когда ты просишь.</p></div>
 <p class="small">Прогресс хранится только в этом браузере.</p>`;
}

/* ---------- звёзды ---------- */
(function(){
 const c=$('#sky'), x=c.getContext('2d'), still=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let W,H,dpr,stars=[],shoot=null,raf=0;
 function size(){dpr=Math.min(2,devicePixelRatio||1);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;
  stars=Array.from({length:Math.round(innerWidth*innerHeight/1700)},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()**3*1.5+.35)*dpr,a:Math.random()*.6+.25,f:Math.random()*1.8+.4,p:Math.random()*6.3,h:Math.random()}))}
 function draw(t){
  x.clearRect(0,0,W,H);
  for(const s of stars){x.globalAlpha=still?s.a:s.a*(.6+.4*Math.sin(t/1000*s.f+s.p));x.fillStyle=s.h>.93?'#ffd9a0':s.h>.86?'#a9dcff':'#ffffff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill()}
  if(!still){
   if(!shoot&&Math.random()<.0015) shoot={x:W*(.3+Math.random()*.7),y:H*Math.random()*.35,l:0};
   if(shoot){const k=shoot.l*16*dpr,hx=shoot.x-k,hy=shoot.y+k*.45,g=x.createLinearGradient(hx,hy,hx+110*dpr,hy-50*dpr);
    g.addColorStop(0,'rgba(255,240,220,.9)');g.addColorStop(1,'rgba(255,240,220,0)');x.globalAlpha=1-shoot.l/45;x.strokeStyle=g;x.lineWidth=1.6*dpr;
    x.beginPath();x.moveTo(hx,hy);x.lineTo(hx+110*dpr,hy-50*dpr);x.stroke();if(++shoot.l>45)shoot=null}
   raf=requestAnimationFrame(draw);
  }
  x.globalAlpha=1;
 }
 size(); draw(0);
 addEventListener('resize',()=>{size();if(still)draw(0)});
 document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!still&&!document.hidden)raf=requestAnimationFrame(draw)});
})();

 sample=apiKey()?SAMPLE:null; toolsOK=!!sample;

 if(saved){const draft=S.cur.draft; S=Object.assign(fresh(),saved); S.set=Object.assign({tier:'default'},S.set); S.prog=Object.assign(freshProg(),S.prog||{}); if(!S.cur){S.cur=newProblem({...STARTER});S.cur.draft=draft}}
 ready=true; renderHours(); render(); greet();
 fetch('data.json').then(r=>r.json()).then(d=>{OLY=d.olympiads;RULES=d.rules;if(view==='plan'||view==='progress')drawView()}).catch(e=>console.warn('data',e));
 if(window.MathJax?.startup?.promise) MathJax.startup.promise.then(()=>render());
})();
